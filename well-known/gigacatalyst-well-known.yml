note: >-
  Every /.well-known/ path was probed on all three Gigacatalyst hosts and NOT ONE returned a
  real document, so no WellKnown or SecurityTxt pointer is emitted in apis.yml. This file
  records the absence, which is valid data - it is not evidence of a served surface.

  Two distinct failure shapes were observed and must not be confused:

  1. gigacatalyst.com (Next.js on Vercel) answers an honest HTTP 404 for every
     /.well-known/ path. A genuine miss.
  2. app.gigacatalyst.com and v2.gigacatalyst.com are single-page-app catch-alls that answer
     HTTP 200 with `content-type: text/html` and an HTML document shell for EVERY path,
     including paths that plainly do not exist. These 200s are SOFT 404s and are recorded
     below as `real_document: false`. Treating them as hits is the dominant false positive on
     this probe.
