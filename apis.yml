  note: >-
    Contract discovery overturned the prior "API consumer, no public API" conclusion.
    Gigacatalyst publishes one real, live, unauthenticated API operation - POST
    https://v2.gigacatalyst.com/api/self-serve/register - documented only inside
    provider-published agent instructions at https://v2.gigacatalyst.com/agent.md, which are
    saved verbatim as agent skills. Also found: official npm SDK + CLI (gigacatalyst 0.2.2,
    2026-07-07), an Apache-2.0 browser extension, a trust center, and a vulnerability
    disclosure policy at a non-standard path. Corrected a false SOC 2 certification credit
    written by the mechanical trust-center probe.
