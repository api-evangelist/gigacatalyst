name: Gigacatalyst
description: >-
  Gigacatalyst (Giga Next Inc.) is a Y Combinator-backed enterprise AI platform that
  embeds an API-connected app builder directly into B2B SaaS products, so that
  customers, solutions engineers, and customer-success teams can describe a
  dashboard, report, or workflow in natural language and have it generated against
  the host product's own APIs, design language, permissions, and roles. Generated
  apps run inside the customer's environment using the signed-in user's session
  credentials, with granular write control and a choice of a Managed deployment
  (routed through the Gigacatalyst proxy for caching, rate limiting, and analytics,
  with AWS Bedrock zero-retention AI) or a Direct deployment where nothing routes
  through Gigacatalyst and the customer brings their own AI key. Gigacatalyst is
  primarily an API consumer rather than an API producer, but it does publish one
  public, unauthenticated, agent-facing operation - the self-serve registration
  endpoint documented at v2.gigacatalyst.com/agent.md - plus an official npm SDK and
  CLI, an embeddable React chat component, and an open-source browser extension.
