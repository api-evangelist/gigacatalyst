apis:
- name: Gigacatalyst Self-Serve Registration API
  description: >-
    The one public, unauthenticated operation Gigacatalyst publishes on its own
    behalf. A coding agent reads the project's API surface, builds a JSON
    description of it (organization, integrations, tools with inputSchema and
    outputSchema, safety levels, optional domain documents) and POSTs it to
    https://v2.gigacatalyst.com/api/self-serve/register, which creates the human's
    workspace and returns a single-use sign-in URL, an account password, a tool
    count, and a per-connection credential checklist. The request and response
    contracts, the validation rules the endpoint enforces, and the auth vocabulary
    are documented in full in the provider-published agent instructions at
    https://v2.gigacatalyst.com/agent.md. Verified live: OPTIONS returns 204 with
    "allow: OPTIONS, POST"; GET returns 405.
  humanURL: https://v2.gigacatalyst.com/agent.md
  baseURL: https://v2.gigacatalyst.com
