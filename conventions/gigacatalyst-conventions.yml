note: >-
  Cross-cutting request/response semantics for the one public Gigacatalyst operation, read
  from the provider's published agent instructions. There is no OpenAPI to derive from.
  IDEMPOTENCY: no idempotency-key header or parameter is documented, so NO `Idempotency`
  pointer is emitted in apis.yml. The endpoint does have a repeat-safe behaviour (a second
  POST for an address that already has an account returns `isNewWorkspace: false` and creates
  nothing) but that is server-side dedupe on the email address, not a client-supplied
  idempotency contract, and it must not be scored as one.
authentication:
  style: none
  detail: anonymous POST; see authentication/gigacatalyst-authentication.yml
transport:
  protocol: https
  method: POST
  base_url: https://v2.gigacatalyst.com
  path: /api/self-serve/register
  content_type: application/json
  max_request_bytes: 512000
  max_request_note: '"Keep the whole thing under 500 KB."'
  verified:
    fetched: '2026-08-14'
    options_status: 204
    options_allow: OPTIONS, POST
    get_status: 405
idempotency:
  supported: false
  header: null
  detail: >-
    No Idempotency-Key header or equivalent is documented. Repeat submission of the same
    email is deduped server-side: `isNewWorkspace: false` is returned, no new workspace is
    created, and `password` is deliberately withheld to prevent takeover of an existing
    account.
pagination:
  supported: false
  detail: Single-operation API with no collection reads; no pagination surface exists.
versioning:
  scheme: host
  detail: >-
    The API lives on the `v2.` host and the older `app.` host is still resolving. No version
    header, no version path segment, and no published versioning or deprecation policy.
  current: v2
  docs: null
error_envelope:
  format: json
  rfc9457: false
  detail: >-
    No error envelope is published. The response documents an `ok: true` boolean on success,
    which implies a boolean-flag envelope rather than RFC 9457 problem+json, but the failure
    body shape is not documented. See errors/gigacatalyst-problem-types.yml.
rate_limit_signaling:
  documented: false
  detail: >-
    No rate-limit headers or limits are published for the registration endpoint. The trust
    center says the Managed-mode proxy performs rate limiting on the customer's own API
    traffic, but publishes no numbers. See rate-limits/gigacatalyst-rate-limits.yml.
request_tracing:
